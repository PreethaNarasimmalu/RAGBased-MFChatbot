name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '40 4 * * *'    # 04:40 UTC = 10:10 AM IST (10 mins after daily scrape)
  workflow_dispatch:

jobs:
  ping:
    name: Ping Streamlit app to prevent sleep
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://indmoney-mfchatbot.streamlit.app/

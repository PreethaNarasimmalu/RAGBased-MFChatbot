name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    name: Ping Streamlit app to prevent sleep
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://indmoney-mfchatbot.streamlit.app/

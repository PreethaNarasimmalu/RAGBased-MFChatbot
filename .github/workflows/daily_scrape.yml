# Phase 7 — Daily Mutual Fund Data Scraper
#
# Trigger: every day at 04:30 UTC (10:00 AM IST = 04:30 UTC)
# Also triggered manually via workflow_dispatch for on-demand scraping.
#
# What it does:
#   1. Checkout the repository
#   2. Install all Python dependencies (requirements.txt)
#   3. Install Playwright's Chromium browser (INDmoney is a React SPA)
#   4. Run the scraper → writes phase2/data/raw/<fund_id>.json for all 5 funds
#   5. Run ingest.py → rebuilds ChromaDB with today's scraped_at timestamp
#      (always runs — ensures "Last updated" shows today's date even if values unchanged)
#   6. Commit and push updated JSON + ChromaDB back to the repo
#      → Streamlit Cloud detects the new commit and auto-redeploys with fresh data
#
# Failure behaviour:
#   - If the scraper fails (INDmoney blocks, timeout, etc.) the workflow
#     fails visibly in the Actions log.
#   - The previous data/raw/*.json files are NOT modified; the app keeps
#     serving the last-good data with correct `scraped_at` timestamps.

name: Daily Mutual Fund Data Scrape

on:
  schedule:
    - cron: '30 4 * * *'    # 04:30 UTC = 10:00 AM IST (India Standard Time)
  workflow_dispatch:         # Allow manual trigger from GitHub Actions UI

jobs:
  scrape:
    name: Scrape INDmoney fund pages and commit updates
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      PYTHONIOENCODING: utf-8   # Force UTF-8 stdout on Windows runner (prevents charmap errors)

    permissions:
      contents: write        # Required to git push updated JSON back to repo

    steps:
      # ── Step 1: Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Dependencies ─────────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Step 3: Playwright browser ───────────────────────────────────────────
      # playwright is excluded from requirements.txt (Streamlit Cloud compat),
      # so install it explicitly here for the scraper job only.
      - name: Install Playwright Chromium browser
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      # ── Step 4: Scrape ───────────────────────────────────────────────────────
      - name: Run scraper for all 5 fund pages
        run: python phase2/scraping/scraper.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── Step 5: Rebuild ChromaDB ─────────────────────────────────────────────
      # Always runs — even if fund values haven't changed, the fresh scraped_at
      # timestamp is upserted so "Last updated" in the chatbot shows today's date.
      - name: Rebuild ChromaDB from fresh fund data
        run: python phase3/ingestion/ingest.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── Step 6: Commit & push ────────────────────────────────────────────────
      # Always commits so Streamlit Cloud redeploys with today's scraped_at.
      - name: Commit and push updated fund data and ChromaDB
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add phase2/data/raw/ chroma_db/
          $date = python -c "import datetime; print(datetime.date.today())"
          git commit -m "chore: daily scrape + ingest $date"
          if ($LASTEXITCODE -ne 0) { Write-Host "Nothing to commit"; exit 0 }
          git push

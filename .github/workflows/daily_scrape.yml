# Phase 7 — Daily Mutual Fund Data Scraper
#
# Trigger: every day at 04:30 UTC (10:00 AM IST = 04:30 UTC)
# Also triggered manually via workflow_dispatch for on-demand scraping.
#
# What it does:
#   1. Checkout the repository
#   2. Set up Python 3.11
#   3. Install all Python dependencies (requirements.txt)
#   4. Install Playwright's Chromium browser (INDmoney is a React SPA)
#   5. Run the scraper → writes phase2/data/raw/<fund_id>.json for all 5 funds
#   6. Run ingest.py → rebuilds ChromaDB with today's scraped_at timestamp
#      (always runs — ensures "Last updated" shows today's date even if values unchanged)
#   7. Commit and push updated JSON + ChromaDB back to the repo
#      → Streamlit Cloud detects the new commit and auto-redeploys with fresh data
#
# Failure behaviour:
#   - If the scraper fails (INDmoney blocks, timeout, etc.) the workflow
#     fails visibly in the Actions log.
#   - The previous data/raw/*.json files are NOT modified; the app keeps
#     serving the last-good data with correct `scraped_at` timestamps.

name: Daily Mutual Fund Data Scrape

on:
  schedule:
    - cron: '30 4 * * *'    # 04:30 UTC = 10:00 AM IST (India Standard Time)
  workflow_dispatch:         # Allow manual trigger from GitHub Actions UI

jobs:
  scrape:
    name: Scrape INDmoney fund pages and commit updates
    runs-on: self-hosted
    timeout-minutes: 30

    permissions:
      contents: write        # Required to git push updated JSON back to repo

    steps:
      # ── Step 1: Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Python ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Step 3: Dependencies ─────────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Step 4: Playwright browser ───────────────────────────────────────────
      # We install system deps manually to handle the Ubuntu 24.04 package renames
      # (libasound2 → libasound2t64, libatk → libatk1.0-0t64, etc.) that break
      # `playwright install --with-deps` on the current ubuntu-latest runner.
      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -q
          # Packages with stable names across Ubuntu 22 and 24
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libdrm2 libgbm1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libpango-1.0-0 libcairo2 libx11-6 libxcb1 libxext6 libxrender1 \
            libxfixes3
          # Packages renamed in Ubuntu 24.04 — try new names first, fall back to old
          sudo apt-get install -y libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 2>/dev/null || \
          sudo apt-get install -y libasound2 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2

      - name: Install Playwright Chromium browser
        run: playwright install chromium

      # ── Step 5: Scrape ───────────────────────────────────────────────────────
      - name: Run scraper for all 5 fund pages
        run: python phase2/scraping/scraper.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── Step 6: Rebuild ChromaDB ─────────────────────────────────────────────
      # Always runs — even if fund values haven't changed, the fresh scraped_at
      # timestamp is upserted so "Last updated" in the chatbot shows today's date.
      - name: Rebuild ChromaDB from fresh fund data
        run: python phase3/ingestion/ingest.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── Step 7: Commit & push ────────────────────────────────────────────────
      # Always commits so Streamlit Cloud redeploys with today's scraped_at.
      - name: Commit and push updated fund data and ChromaDB
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add phase2/data/raw/ chroma_db/
          git commit -m "chore: daily scrape + ingest $(date -u +'%Y-%m-%d')" || echo "Nothing to commit"
          git push
